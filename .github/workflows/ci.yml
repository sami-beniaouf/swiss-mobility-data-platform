name: CI/CD

# Lint, tests, the dbt parse check and the Terraform check run on every push and on
# pull requests to main.
# Deployment to Azure runs only on a push to main, and only when all checks passed.
on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Lint and test the ingestion
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Python 3.13 (same version as the Function)
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            src/requirements.txt
            tests/requirements.txt

      - name: Install dependencies
        run: pip install -r tests/requirements.txt

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Run tests (pytest)
        run: pytest -v

  dbt:
    name: Parse the dbt project
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: swiss-mobility-dbt

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: swiss-mobility-dbt/ci/requirements.txt

      - name: Install dbt
        run: pip install -r ci/requirements.txt

      # Checks SQL/Jinja syntax, ref() and source() links and the YAML files, without
      # connecting to the Warehouse (ci/profiles.yml only holds a placeholder server).
      - name: Parse the project (dbt parse)
        run: dbt parse
        env:
          DBT_PROFILES_DIR: ci

  terraform:
    name: Check the Terraform configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.17.2"

      # Style (indentation, alignment) and configuration checks, without access to
      # Azure: -backend=false skips the remote state, validate needs no credentials.
      - name: Format (terraform fmt)
        run: terraform fmt -check -diff

      - name: Initialise without backend
        run: terraform init -backend=false -input=false

      - name: Validate (terraform validate)
        run: terraform validate

  deploy:
    name: Deploy to Azure Functions
    needs: [test, dbt]                            # deploy only when every check passed
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-production                    # one deployment at a time, never cancelled midway
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write                             # lets the job request a GitHub OIDC token for Azure

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      # Workload identity federation: no secret. Azure trusts tokens issued by GitHub for
      # this repository and branch main only (federated credential on sp-swissmobility-github).
      - name: Log in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy src/ to the Function App (remote build)
        uses: Azure/functions-action@v1
        with:
          app-name: func-swissmobility-sb
          package: src
          remote-build: true
