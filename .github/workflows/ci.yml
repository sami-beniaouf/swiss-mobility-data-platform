name: CI/CD

# Lint and tests run on every push and on pull requests to main.
# Deployment to Azure runs only on a push to main, and only when the tests passed.
on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Lint and test the ingestion
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Python 3.13 (same version as the Function)
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            src/requirements.txt
            tests/requirements.txt

      - name: Install dependencies
        run: pip install -r tests/requirements.txt

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Run tests (pytest)
        run: pytest -v

  deploy:
    name: Deploy to Azure Functions
    needs: test                                   # never deploy code whose tests failed
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-production                    # one deployment at a time, never cancelled midway
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write                             # lets the job request a GitHub OIDC token for Azure

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      # Workload identity federation: no secret. Azure trusts tokens issued by GitHub for
      # this repository and branch main only (federated credential on sp-swissmobility-github).
      - name: Log in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy src/ to the Function App (remote build)
        uses: Azure/functions-action@v1
        with:
          app-name: func-swissmobility-sb
          package: src
          remote-build: true
