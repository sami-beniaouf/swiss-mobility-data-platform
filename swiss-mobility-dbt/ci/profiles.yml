# Profile used in CI for `dbt parse` only: dbt needs a profile to load the project,
# but parsing never connects to the Warehouse. The server name is a placeholder.
swiss_mobility:
  target: ci
  outputs:
    ci:
      type: fabric
      driver: "ODBC Driver 18 for SQL Server"
      server: ci-placeholder.datawarehouse.fabric.microsoft.com
      port: 1433
      database: wh_mobility
      schema: dbo
      authentication: CLI
      threads: 1
