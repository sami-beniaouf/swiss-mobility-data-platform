version: 2

sources:
  - name: bronze_transport
    description: >
      Raw departures from transport.opendata.ch (/v1/stationboard), landed in the
      Lakehouse by the ingestion job (`src/ingestion`, Azure Function every 15 minutes). Append-only: one row per
      departure per run, so the same departure appears several times (deduplicated in staging).
    database: lh_mobility        # Lakehouse SQL endpoint, read cross-database from the Warehouse
    schema: dbo
    loaded_at_field: _ingested_at
    freshness:
      warn_after: {count: 6, period: hour}
      error_after: {count: 24, period: hour}
    tables:
      - name: transport_stationboard
        description: Flattened stationboard JSON. All timestamps are UTC.
        columns:
          - name: station_id
            description: DIDOK/BPUIC id of the polled station (stationboard.station.id)
          - name: category
            description: Train/bus category code (IC, IR, RE, S, B, T, ...)
          - name: line_number
            description: Line or train number (stationboard.number)
          - name: operator
          - name: destination
            description: Final destination (stationboard.to)
          - name: departure_planned_utc
            description: Scheduled departure in UTC, derived from stop.departureTimestamp (Unix epoch)
          - name: departure_planned_raw
            description: Scheduled departure as returned by the API (stop.departure), local time with UTC offset, e.g. 2026-10-04T20:53:00+0200. Kept for traceability
          - name: delay_min
            description: Delay in minutes (stop.delay); null when no real-time data is available (unknown, not on time)
          - name: platform
          - name: _ingested_at
            description: Start time of the ingestion run that wrote the row (UTC)
          - name: _batch_id
            description: Ingestion run id (run start, UTC, YYYYMMDDTHHMMSSZ). Joins to the ingestion log

  - name: bronze_oracle
    description: >
      Reference data of the Oracle data hub, exported once a day by the Azure Function
      (`src/ingestion/reference.py`) to ADLS bronze and loaded into the Lakehouse with the
      departures. Each export is a full snapshot; staging keeps the latest one (`_batch_id`).
    database: lh_mobility
    schema: dbo
    loaded_at_field: _extracted_at
    freshness:
      warn_after: {count: 30, period: hour}
      error_after: {count: 72, period: hour}
    tables:
      - name: oracle_stations
        columns:
          - name: station_id
          - name: station_name
          - name: municipality_bfs_nr
            description: Official BFS municipality number (verified against swissBOUNDARIES3D)
          - name: canton_code
          - name: lv95_e
            description: Swiss LV95 easting (EPSG:2056)
          - name: lv95_n
            description: Swiss LV95 northing (EPSG:2056)
          - name: updated_at
            description: Last change of the row in the hub (UTC)
          - name: _extracted_at
            description: Time of the export run (UTC)
          - name: _batch_id
            description: Export run id (UTC, YYYYMMDDTHHMMSSZ); the latest one is the current snapshot
      - name: oracle_cantons
        columns:
          - name: canton_code
          - name: canton_name
          - name: language_region
          - name: _extracted_at
            description: Time of the export run (UTC)
          - name: _batch_id
            description: Export run id (UTC, YYYYMMDDTHHMMSSZ); the latest one is the current snapshot
