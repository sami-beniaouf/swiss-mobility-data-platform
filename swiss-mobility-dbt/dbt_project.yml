name: swiss_mobility
version: "1.0.0"
config-version: 2

profile: swiss_mobility

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
seed-paths: ["seeds"]

clean-targets: ["target", "dbt_packages"]

vars:
  # Calendar dimension range
  date_spine_start: "2024-01-01"
  date_spine_days: 3650
  # Swiss convention: punctual if delay < 3 minutes
  punctuality_threshold_min: 3

seeds:
  swiss_mobility:
    +schema: reference
    transport_categories:
      +column_types:
        category: varchar(10)
        transport_mode: varchar(20)
        category_label: varchar(50)

models:
  swiss_mobility:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: view
    marts:
      +schema: marts
      +materialized: table
